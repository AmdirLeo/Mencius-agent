version: '3.8'

services:
  web:
    build: .
    container_name: mencius-agent
    ports:
      - "8000:8000"
    environment:
      - GLM_API_KEY=${GLM_API_KEY:-}
      - DEBUG=False
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mencius-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

volumes:
  qdrant_storage:
